 ответ, критерии, объяснение и соответствие проверяемому умению. Нужно работать с заданиями в экзаменационном формате, тренировочными заданиями по темам, объяснениями правил, разборами ошибок ученика и проверкой рукописных работ по фото.\nПроведение калибровки разметчиков и разбор расхождений\nВы будете помогать команде одинаково применять критерии оценки: разбирать расхождения между разметчиками и ревьюерами, собирать сложные и пограничные случаи и превращать их в понятные правила и примеры для инструкции.\nУправление командой\nНужно будет распределять нагрузку, следить за соответствием компетенции исполнителей назначаемым заданиям, а также мониторить качество и скорость разметки, работать над её улучшением.\nЭкспертиза и ревью\nВам предстоит смотреть на материал сразу с двух сторон: корректен ли русский язык и помогает ли это конкретной учебной задаче ребёнка. Вы будете принимать решения, объяснять их разметчикам и влиять на качество продукта в целом.\nРаботали методистом, преподавателем или редактором образовательного контента\nОтлично знаете русский язык и школьную программу 5–11-го классов\nПонимаете формат ОГЭ и ЕГЭ по русскому языку\nИмеете опыт разметки данных, ревью разметки или контроля качества\nУмеете замечать неоднозначное в заданиях и формулировках\nГотовы принимать решения в спорных случаях и аргументировать их\nСпособны объяснять свои решения разметчикам понятно и без конфликтов\nУмеете видеть системные проблемы и превращать их в правила и инструкции\nВнимательны к деталям, но при этом не теряете общую картину\nГотовы работать с большим объёмом контента и соблюдать сроки\nРаботали с ИИ-контентом\nГотовили школьников к экзаменам по русскому языку\nСоставляли или проверяли экзаменационные задания\nОфициальное трудоустройство по ТК РФ\nПолностью удалённая работа из любого региона РФ, график 5/2 с 10 до 19 часов (мск) с перерывом на обед\nРеальная возможность влиять на продукт: вы будете не просто выполнять задачи, а участвовать в развитии образовательны
