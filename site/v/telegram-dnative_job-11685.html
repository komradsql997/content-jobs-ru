\nSpot Talents — 4 публикации.\nRed Flag — 4 публикации.\nBig Black Studio — 4 публикации.\n🕹\nТребования к кандидату:\nНам подойдет человек, который:\n• Имеет опыт ведения социальных сетей брендов или компаний.\n• Умеет организовывать процессы, соблюдать сроки и работать с контент-календарем.\n• Обладает хорошим визуальным вкусом, понимает основы композиции и оформления публикаций.\n• Грамотно пишет и умеет редактировать чужие тексты.\n• Понимает специфику Instagram и Telegram.\n• Не боится общаться с коллегами, задавать вопросы, уточнять детали и самостоятельно двигать задачи вперед.\n• Интересуется кино, рекламой и визуальной культурой.\n• Опыт работы в кино или рекламном продакшне будет преимуществом, но не является обязательным.\n🕹\nПримерный уровень ЗП:\n80 000 – 100 000 ₽\n🕹\nУсловия работы:\nУсловия:\nОфис в Москве.\nФормат: гибридный.\nОклад: от 80.000р в первые три месяца работы.\n🕹\nОткликнуться:\nhttps://vetka.dnative.ru/employer-jobs/811\n* Instagram принадлежит Meta, признанной в РФ экстремистской организацией, её деятельность запрещена.","location":"Москва","salary":"100 000 ₽","category":"SMM","seen_at":"2026-11-24T09:41:20Z","first_seen_at":"2026-11-24T09:41:20Z","level":"middle","work_format":"","city":"Москва","salary_estimate":"","salary_estimate_basis":0,"score":100,"id":"telegram-dnative_job-11685","channel":"dnative_job","source_kind":"telegram_public","extraction_version":3,"salary_estimate_source":""},"active":true}</script>
