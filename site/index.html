<!doctype html>

<main class="wrap"><section class="hero" aria-label="Статистика сайта"><div class="hero-strip"><span class="hero-data">Последнее обновление вакансий: <strong id="lastUpdated">загружаем…</strong></span><span class="hero-data">Проверено источников: <strong id="sources">—</strong></span><span class="hero-data">Найдено вакансий: <strong id="total">—</strong></span></div></section>
