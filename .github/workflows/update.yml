name: Обновить вакансии и сайт

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/jobs.json'
  workflow_dispatch:
  schedule:
    # Москва UTC+3: 11:00, 16:00, 21:00
    - cron: '0 8,13,18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: content-jobs-release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Проверить логику
        run: python -m unittest discover -s tests -v
      - name: Проверить интерфейс и форматирование карточек
        run: |
          node --check site/job-text.js
          node --check site/app.js
          node --check site/job-detail.js
          node --test tests/test_job_text.cjs
      - name: Собрать российские вакансии
        run: python scripts/collect.py
      - name: Сбор вакансий из публичных Telegram-каналов
        run: python scripts/telegram_public.py
      - name: Создать отдельные страницы вакансий
        run: python scripts/build_job_pages.py
      - name: Проверить каталог карьерных источников
        run: python scripts/source_audit.py
      - name: Сохранить диагностический отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-diagnostics
          path: |
            reports/source_diagnostics.json
            reports/source_catalog_health.json
            reports/telegram_public_diagnostics.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Зафиксировать обновлённые вакансии
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add site/jobs.json data/telegram_public_jobs.json site/job-history.json site/v
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh vacancies"
            git push
          fi
      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
